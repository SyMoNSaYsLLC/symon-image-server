    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/apps.css" />
  </head>
  <body>
    <header class="topbar">
      <h1><a href="../index.html" class="home-link">Symoneural</a> › LLM Ops</h1>
    </header>
    <div class="root-layout">
      <nav class="sidebar-nav">
        <a class="nav-item" href="../index.html"><span class="nav-icon">🏠</span> Model Manager</a>
        <a class="nav-item" href="chatbot.html"><span class="nav-icon">💬</span> Chatbot</a>
        <a class="nav-item" href="code_assist.html"><span class="nav-icon">💻</span> Code Assistant</a>
        <a class="nav-item" href="calculator.html"><span class="nav-icon">∫</span> Calculator</a>
        <a class="nav-item" href="text_to_image.html"><span class="nav-icon">🖼</span> Text to Image</a>
        <a class="nav-item" href="text_to_video.html"><span class="nav-icon">🎬</span> Text to Video</a>
        <a class="nav-item" href="iptv.html"><span class="nav-icon">📺</span> IPTV</a>
        <a class="nav-item" href="tensor_lab.html"><span class="nav-icon">🔢</span> Tensor Lab</a>
        <a class="nav-item" href="mining.html"><span class="nav-icon">⛏️</span> Mining</a>
        <a class="nav-item" href="embedded.html"><span class="nav-icon">��</span> Embedded</a>
        <a class="nav-item nav-item--active" href="llm_ops.html"><span class="nav-icon">🧠</span> LLM Ops</a>
        <a class="nav-item" href="terminal.html"><span class="nav-icon">⌨️</span> Terminal</a>
      </nav>
      <main class="layout">
        <section class="panel">
          <h2>Create</h2>
          <form id="createForm">
            <label>Model <input name="model" value="llama3" /></label>
            <label>Prompt <textarea name="prompt" rows="5" required></textarea></label>
            <button type="submit">Queue Create</button>
          </form>
        </section>
        <section class="panel">
          <h2>Update</h2>
          <form id="updateForm">
            <label>Model <input name="model" value="llama3" /></label>
            <label>Artifact ID <input name="artifact_id" required /></label>
            <label>Diff <textarea name="diff" rows="5" required></textarea></label>
            <button type="submit">Queue Update</button>
          </form>
        </section>
        <section class="panel">
          <h2>Queue + Output</h2>
          <div id="queueStatus"></div>
          <pre id="llmOutput" class="build-log"></pre>
        </section>
      </main>
    </div>
    <script src="../js/apps/llm_ops.js"></script>
  </body>
</html>
